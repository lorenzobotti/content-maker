<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<!-- Static (not in svelte:head) because ssr is off and link previewers don't run JS. -->
		<title>tool to make tiktoks</title>
		<meta
			name="description"
			content="in-browser vertical lyric videos for tiktok and ig reels"
		/>
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="canonical" href="https://content.botti.cc/" />
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://content.botti.cc/" />
		<meta property="og:title" content="lyric video maker" />
		<meta
			property="og:description"
			content="make vertical lyric videos in your browser for tiktok and ig reels"
		/>
		<meta property="og:image" content="https://content.botti.cc/og.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta name="twitter:card" content="summary_large_image" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
